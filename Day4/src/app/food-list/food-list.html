<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<h2>Available Foods</h2>
<ul class="d-flex flex-row bd-highlight mb-3 gap-4">
    @for(food of foods; track food.id){
        <div class="card" style="width: 18rem;">
  <div class="card-body">
    <img [src]="food.imageUrl" alt="" width="100" height="100">
    <p><strong>{{food.name}}</strong></p>
    <p>{{food.category}}</p>
    <p>Price - ₹{{food.price}}</p>
    <a [routerLink]="['/food', food.id]">View Details</a>
        <button class="btn btn-sm btn-success" (click)="AddFood(food)">
          Add to Cart
        </button>
  </div>
</div>
 }
</ul>
