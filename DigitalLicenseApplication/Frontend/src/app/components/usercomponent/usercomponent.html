<div class="user-container">

  <!-- Top controls -->
  <div class="top-bar">
    <div class="left-controls">
      <button class="add-btn" (click)="openAddModal()">Add User</button>

      <select 
        [disabled]="isDepartmentFilterDisabled" 
        (change)="onDepartmentChange($event)"
      >
        <option value="">All Departments</option>
        <option *ngFor="let dept of departments" [value]="dept.departmentId">
          {{ dept.name }}
        </option>
      </select>
    </div>

    <div class="role-filters">
      <button [class.active]="roleFilter==='All'" (click)="filterByRole('All')">All</button>
      <button [class.active]="roleFilter==='User'" (click)="filterByRole('User')">User</button>
      <button [class.active]="roleFilter==='Officer'" (click)="filterByRole('Officer')">Officer</button>
      <button [class.active]="roleFilter==='Admin'" (click)="filterByRole('Admin')">Admin</button>
    </div>
  </div>

  <!-- Notification -->
  <div *ngIf="notification" class="notification" [ngClass]="notification.type">
    {{ notification.message }}
  </div>

  <!-- Users table -->
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Department</th>
        <th>Contact</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of filteredUsers">
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>{{ getDepartmentName(user.departmentId) }}</td>
        <td>{{ user.contactNumber }}</td>
        <td>
          <button class="edit-btn" (click)="openEditModal(user)">Edit</button>
          <button class="delete-btn" (click)="deleteUser(user.userId)">Delete</button>
        </td>
      </tr>
      <tr *ngIf="filteredUsers.length === 0">
        <td colspan="6" class="no-data">No users found</td>
      </tr>
    </tbody>
  </table>

  <!-- Add/Edit Modal -->
  <div class="modal" *ngIf="showModal">
    <div class="modal-content">
      <h3>{{ isEditMode ? 'Edit User' : 'Add User' }}</h3>
      <form (ngSubmit)="saveUser()">
        <div class="form-group">
          <label>Name *</label>
          <input type="text" [(ngModel)]="currentUser.name" name="name" required />
        </div>

        <div class="form-group">
          <label>Email *</label>
          <input type="email" [(ngModel)]="currentUser.email" name="email" required />
        </div>

        <div class="form-group">
          <label>Role *</label>
          <select [(ngModel)]="currentUser.role" name="role" required>
            <option value="">Select Role</option>
            <option value="User">User</option>
            <option value="Officer">Officer</option>
            <option value="Admin">Admin</option>
          </select>
        </div>

        <div class="form-group" *ngIf="currentUser.role==='Officer'">
          <label>Department *</label>
          <select [(ngModel)]="currentUser.departmentId" name="departmentId" required>
            <option value="">Select Department</option>
            <option *ngFor="let dept of departments" [value]="dept.departmentId">{{ dept.name }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>Contact Number</label>
          <input type="text" [(ngModel)]="currentUser.contactNumber" name="contactNumber" />
        </div>

        <div class="modal-buttons">
          <button type="submit">{{ isEditMode ? 'Update' : 'Add' }}</button>
          <button type="button" (click)="showModal=false">Cancel</button>
        </div>
      </form>
    </div>
  </div>

</div>
